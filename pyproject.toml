[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solweig-cuda"
version = "1.0.0"
description = "SOLWEIG radiation and thermal comfort modelling with CUDA"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "README.md", "NOTICE.md"]
authors = [
    {name = "Zeting Li", email = "zeting.li@ucdconnect.ie"},
]
dependencies = [
    "numpy>=2,<2.6",
    "scipy>=1.11,<2",
    "cupy-cuda12x>=14.1,<15",
    "GDAL>=3.6,<4",
    "rasterio>=1.3,<2",
    "shapely>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
met = ["pandas>=2", "xarray>=2024.1", "netCDF4>=1.6", "cdsapi>=0.7.7,<1"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
solweig-cuda = "src.cli:main"

[tool.setuptools]
include-package-data = false
py-modules = ["run"]
packages = [
    "src",
    "scripts",
]

[tool.setuptools.package-data]
src = ["kernels/*.cu", "landcoverclasses_2016a.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an NVIDIA GPU and a working CUDA runtime"]
